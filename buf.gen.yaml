version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: java_package
    - file_option: java_outer_classname
    - file_option: java_multiple_files
    - file_option: go_package
inputs:
  - directory: proto
  - module: buf.build/googleapis/googleapis
plugins:
  - remote: buf.build/apple/swift
    out: Server/Sources/ExactMacProto
    opt:
      - Visibility=Public
    include_imports: true
  - remote: buf.build/grpc/swift-protobuf
    out: Server/Sources/ExactMacProto
    opt:
      - Visibility=Public
      - Server=true
      - Client=false
    include_imports: true
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
