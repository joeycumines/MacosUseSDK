// Input resource definition

syntax = "proto3";

package macosusesdk.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "macosusesdk/type/geometry.proto";

option go_package = "github.com/joeycumines/MacosUseSDK/gen/go/macosusesdk/v1;macosusesdkv1";
option java_multiple_files = true;
option java_outer_classname = "InputProto";
option java_package = "com.macosusesdk.v1";

// A resource representing an input action that was or will be executed.
// Inputs form an execution timeline under an application or the explicit
// desktop wildcard parent while target records the exact delivery authority.
message Input {
  option (google.api.resource) = {
    type: "macosusesdk.com/Input"
    pattern: "applications/{application}/inputs/{input}"
    singular: "input"
    plural: "inputs"
  };

  // Resource name in the format "applications/{application}/inputs/{input}".
  // Desktop-wide input uses the explicit wildcard application segment "-".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The specific action to perform or that was performed.
  InputAction action = 2 [(google.api.field_behavior) = REQUIRED];

  // Current state of the input.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the input was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the input completed (success or failure).
  google.protobuf.Timestamp complete_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Error message if the input failed.
  string error = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Exact authority and coordinate scope selected for this input.
  InputTarget target = 7 [(google.api.field_behavior) = REQUIRED];

  // Truthful delivery commitment recorded after execution settles.
  InputDeliveryResult delivery_result = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State of an input action.
  enum State {
    // Default unspecified state.
    STATE_UNSPECIFIED = 0;

    // Input is pending execution.
    STATE_PENDING = 1;

    // Input is currently executing.
    STATE_EXECUTING = 2;

    // Input completed successfully.
    STATE_COMPLETED = 3;

    // Input failed with an error.
    STATE_FAILED = 4;

    // Input was cancelled before execution or while its owned cleanup settled.
    STATE_CANCELLED = 5;
  }
}

// Exact delivery authority for an input action.
message InputTarget {
  oneof destination {
    // Exact running application resource.
    string application = 1 [(google.api.resource_reference) = {type: "macosusesdk.com/Application"}];

    // Exact opaque window resource.
    string window = 2 [(google.api.resource_reference) = {type: "macosusesdk.com/Window"}];

    // Exact display resource.
    string display = 3 [(google.api.resource_reference) = {type: "macosusesdk.com/Display"}];

    // Explicit authorization for the active desktop union.
    bool desktop = 4;
  }
}

// Delivery truth for one settled input transaction.
message InputDeliveryResult {
  // Degree to which the requested action is known to have reached a physical
  // input sink.
  enum Commitment {
    // The server has no usable delivery classification.
    COMMITMENT_UNSPECIFIED = 0;

    // No requested physical effect reached an operating-system sink.
    COMMITMENT_NO_EFFECT = 1;

    // At least one requested physical effect may have reached an
    // operating-system sink, but complete routed event delivery and safety
    // cleanup could not be proved.
    COMMITMENT_POSSIBLY_COMMITTED = 2;

    // Every requested event reached the selected route and every release
    // obligation settled.
    COMMITMENT_COMMITTED_AND_SETTLED = 3;
  }

  // Delivery commitment after execution and cleanup settle.
  Commitment commitment = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Number of events whose post operation was invoked.
  int32 posted_event_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether delivery on the selected application/window/display/desktop route
  // was observed rather than inferred from a void posting API.
  bool routed_delivery_observed = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Specification of an input action.
message InputAction {
  reserved 17 to 19;
  reserved "gesture", "button_down", "button_up";

  // Whether to show visual feedback during execution.
  bool show_animation = 1 [(google.api.field_behavior) = OPTIONAL];

  // Duration of visual feedback in seconds.
  double animation_duration = 2 [(google.api.field_behavior) = OPTIONAL];

  // The specific input type and parameters.
  oneof input_type {
    // Click at a specific point.
    MouseClick click = 10;

    // Type the specified text.
    TextInput type_text = 11;

    // Press a key combination.
    KeyPress press_key = 12;

    // Move mouse to a specific point.
    MouseMove move_mouse = 13;

    // Drag from one point to another.
    MouseDrag drag = 14;

    // Scroll operation.
    Scroll scroll = 15;

    // Hover at a point for duration.
    Hover hover = 16;
  }
}

// Mouse click action.
//
// COORDINATE SYSTEM: Global Display Coordinates (top-left origin, Y increases downward).
// See macosusesdk.type.Point message documentation for detailed coordinate system explanation.
message MouseClick {
  // Position to click in Global Display Coordinates.
  // This uses the same coordinate system as Window.bounds, allowing direct use of
  // window coordinates for click targets.
  macosusesdk.type.Point position = 1 [(google.api.field_behavior) = REQUIRED];

  // Click type.
  optional ClickType click_type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Number of clicks (1 for single, 2 for double, etc.).
  optional int32 click_count = 3 [(google.api.field_behavior) = OPTIONAL];

  // Modifier keys applied atomically to every click event.
  repeated KeyPress.Modifier modifiers = 4 [(google.api.field_behavior) = OPTIONAL];

  // Click type enumeration.
  enum ClickType {
    // Default left click.
    CLICK_TYPE_UNSPECIFIED = 0;

    // Left mouse button.
    CLICK_TYPE_LEFT = 1;

    // Right mouse button.
    CLICK_TYPE_RIGHT = 2;

    // Middle mouse button.
    CLICK_TYPE_MIDDLE = 3;
  }
}

// Text input action.
message TextInput {
  reserved 2;
  reserved "use_ime";

  // Text to type.
  string text = 1 [(google.api.field_behavior) = REQUIRED];

  // Delay between characters in seconds.
  double char_delay = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Key press with optional modifiers.
message KeyPress {
  // Key code or name (e.g., "return", "a", "f1").
  string key = 1 [(google.api.field_behavior) = REQUIRED];

  // Modifier keys to hold during press.
  repeated Modifier modifiers = 2 [(google.api.field_behavior) = OPTIONAL];

  // Duration to hold the key in seconds. If 0 or unset, performs a normal press/release.
  double hold_duration = 3 [(google.api.field_behavior) = OPTIONAL];

  // Modifier key enumeration.
  enum Modifier {
    // Default unspecified modifier.
    MODIFIER_UNSPECIFIED = 0;

    // Command (⌘) key.
    MODIFIER_COMMAND = 1;

    // Option (⌥) key.
    MODIFIER_OPTION = 2;

    // Control (⌃) key.
    MODIFIER_CONTROL = 3;

    // Shift (⇧) key.
    MODIFIER_SHIFT = 4;

    // Function (fn) key.
    MODIFIER_FUNCTION = 5;

    // Caps Lock.
    MODIFIER_CAPS_LOCK = 6;
  }
}

// Mouse move action.
//
// COORDINATE SYSTEM: Global Display Coordinates (top-left origin, Y increases downward).
// See macosusesdk.type.Point message documentation for detailed coordinate system explanation.
message MouseMove {
  // Target position in Global Display Coordinates.
  macosusesdk.type.Point position = 1 [(google.api.field_behavior) = REQUIRED];

  // Duration of movement in seconds (for smooth animation).
  double duration = 2 [(google.api.field_behavior) = OPTIONAL];

  // Modifier keys applied atomically to every movement event.
  repeated KeyPress.Modifier modifiers = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Mouse drag action.
//
// COORDINATE SYSTEM: Global Display Coordinates (top-left origin, Y increases downward).
// See macosusesdk.type.Point message documentation for detailed coordinate system explanation.
message MouseDrag {
  // Starting position in Global Display Coordinates.
  macosusesdk.type.Point start_position = 1 [(google.api.field_behavior) = REQUIRED];

  // Ending position in Global Display Coordinates.
  macosusesdk.type.Point end_position = 2 [(google.api.field_behavior) = REQUIRED];

  // Duration of drag in seconds.
  double duration = 3 [(google.api.field_behavior) = OPTIONAL];

  // Mouse button to use for drag.
  optional MouseClick.ClickType button = 4 [(google.api.field_behavior) = OPTIONAL];

  // Modifier keys applied atomically to every drag event.
  repeated KeyPress.Modifier modifiers = 5 [(google.api.field_behavior) = OPTIONAL];

  // Ordered drag waypoints in Global Display Coordinates. When present, this
  // path is authoritative and must contain at least two points. The first and
  // last points must equal start_position and end_position when those legacy
  // fields are also supplied.
  repeated macosusesdk.type.Point path = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Scroll action.
//
// COORDINATE SYSTEM: Global Display Coordinates (top-left origin, Y increases downward).
// See macosusesdk.type.Point message documentation for detailed coordinate system explanation.
message Scroll {
  // Position to scroll at (optional, uses current mouse position if not set).
  // In Global Display Coordinates.
  macosusesdk.type.Point position = 1 [(google.api.field_behavior) = OPTIONAL];

  // Horizontal scroll amount (positive = right, negative = left).
  double horizontal = 2 [(google.api.field_behavior) = OPTIONAL];

  // Vertical scroll amount (positive = up, negative = down).
  double vertical = 3 [(google.api.field_behavior) = OPTIONAL];

  // Duration of scroll in seconds (for momentum effect).
  double duration = 4 [(google.api.field_behavior) = OPTIONAL];

  // Modifier keys applied atomically to every scroll event.
  repeated KeyPress.Modifier modifiers = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Hover action.
//
// COORDINATE SYSTEM: Global Display Coordinates (top-left origin, Y increases downward).
// See macosusesdk.type.Point message documentation for detailed coordinate system explanation.
message Hover {
  // Position to hover at in Global Display Coordinates.
  macosusesdk.type.Point position = 1 [(google.api.field_behavior) = REQUIRED];

  // Duration to hover in seconds.
  double duration = 2 [(google.api.field_behavior) = REQUIRED];
}
