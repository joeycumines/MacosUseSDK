// Ephemeral accessibility element resource

syntax = "proto3";

package exactmac.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option go_package = "github.com/joeycumines/ExactMac/gen/go/exactmac/v1;exactmacv1";
option java_multiple_files = true;
option java_outer_classname = "ElementProto";
option java_package = "io.github.joeycumines.exactmac.v1";

// A UI element retained from an Accessibility traversal. Element resources are
// ephemeral: clients must rediscover them after expiry or server restart.
message Element {
  option (google.api.resource) = {
    type: "exactmac/Element"
    pattern: "applications/{application}/elements/{element}"
    singular: "element"
    plural: "elements"
  };

  // Canonical resource name in the format
  // "applications/{application}/elements/{element}". The element segment is
  // an opaque server-generated ID valid only while this resource is retained.
  //
  // Field 13 is intentionally additive: fields 1 through 12 retain the wire
  // numbers used by element values returned before resource naming existed.
  string name = 13 [(google.api.field_behavior) = IDENTIFIER];

  // The accessibility role of the element (for example, button or text field).
  string role = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Text content of the element, if any.
  optional string text = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // X coordinate in Global Display Coordinates (top-left origin, Y increases downward).
  optional double x = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Y coordinate in Global Display Coordinates (top-left origin, Y increases downward).
  optional double y = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Width of the element in pixels.
  optional double width = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Height of the element in pixels.
  optional double height = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque ephemeral ID for request fields that already carry the application parent.
  string element_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the element is enabled for interaction.
  optional bool enabled = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the element has keyboard focus.
  optional bool focused = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Hierarchy path from the traversal root to this element.
  repeated int32 path = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Additional Accessibility attributes represented as key-value pairs.
  map<string, string> attributes = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Available Accessibility action names.
  repeated string actions = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Parent application resource (for example, "applications/com.apple.TextEdit-abc123").
  // This is the canonical owner at discovery time; a stale element must be re-resolved.
  string parent = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "exactmac/Application"}
  ];
}
