// Script-related resources and types

syntax = "proto3";

package exactmac.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option go_package = "github.com/joeycumines/ExactMac/gen/go/exactmac/v1;exactmacpb";
option java_multiple_files = true;
option java_outer_classname = "ScriptProto";
option java_package = "io.github.joeycumines.exactmac.v1";

// Catalog of scripting dictionaries.
message ScriptingDictionaryCatalog {
  option (google.api.resource) = {
    type: "exactmac/ScriptingDictionaryCatalog"
    pattern: "scriptingDictionaryCatalog"
    singular: "scriptingDictionaryCatalog"
    plural: "scriptingDictionaryCatalogs"
  };

  // Resource name for the singleton scripting dictionary catalog.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Available scripting dictionaries.
  repeated ScriptingDictionary dictionaries = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Scripting dictionary for an application.
message ScriptingDictionary {
  // Application.
  string application = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Application bundle identifier.
  string bundle_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the application supports AppleScript.
  bool supports_applescript = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the application supports JXA.
  bool supports_jxa = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Available scripting commands.
  repeated string commands = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Available scripting classes.
  repeated string classes = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Script type enumeration.
enum ScriptType {
  // Default unspecified type.
  SCRIPT_TYPE_UNSPECIFIED = 0;

  // AppleScript.
  SCRIPT_TYPE_APPLESCRIPT = 1;

  // JavaScript for Automation (JXA).
  SCRIPT_TYPE_JXA = 2;

  // Shell script (bash).
  SCRIPT_TYPE_SHELL = 3;
}
